[workspace]
members = ["cherry-derive", "cherry"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["algobun"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algobun/cherry"
keywords = ["SQLite", "ORM"]
description = "A Rust SQLite ORM."

[workspace.dependencies]
cherry-derive = { path = "cherry-derive" }
rusqlite = ">=0.39.0"
thiserror = "2"

proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
heck = "0"
